name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rodar ShellCheck nos scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: warning

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe do docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config